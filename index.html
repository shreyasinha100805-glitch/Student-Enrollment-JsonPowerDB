<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Enrollment Form</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        .container { max-width: 700px; margin-top: 30px; }
        .required:after { content: " *"; color: red; }
        .info-text { font-size: 12px; color: #6c757d; }
    </style>
</head>
<body>
<div class="container">
    <div class="panel panel-primary">
        <div class="panel-heading">
            <h3 class="panel-title">
                <span class="glyphicon glyphicon-education"></span> Student Enrollment Form
            </h3>
        </div>
        <div class="panel-body">
            <form id="studentForm">

                <div class="form-group">
                    <label for="rollNo" class="required">Roll Number (Primary Key)</label>
                    <input type="text" class="form-control" id="rollNo"
                           placeholder="Enter Roll Number (e.g., S101)">
                    <div class="info-text">Enter Roll No and press Tab — system checks existence.</div>
                </div>

                <div class="form-group">
                    <label for="fullName" class="required">Full Name</label>
                    <input type="text" class="form-control" id="fullName"
                           placeholder="Enter Full Name" disabled>
                </div>

                <div class="form-group">
                    <label for="studentClass" class="required">Class</label>
                    <input type="text" class="form-control" id="studentClass"
                           placeholder="e.g., 10th-A" disabled>
                </div>

                <div class="form-group">
                    <label for="birthDate" class="required">Birth Date</label>
                    <input type="date" class="form-control" id="birthDate" disabled>
                </div>

                <div class="form-group">
                    <label for="address" class="required">Address</label>
                    <textarea class="form-control" id="address" rows="2"
                              placeholder="House No., Street, City, PIN" disabled></textarea>
                </div>

                <div class="form-group">
                    <label for="enrollmentDate" class="required">Enrollment Date</label>
                    <input type="date" class="form-control" id="enrollmentDate" disabled>
                </div>

                <div>
                    <button type="button" class="btn btn-success" id="saveBtn"   disabled>&#128190; Save</button>
                    <button type="button" class="btn btn-warning" id="updateBtn" disabled>&#9998; Update</button>
                    <button type="button" class="btn btn-default" id="resetBtn"  disabled>&#8635; Reset</button>
                </div>

                <div id="messageDiv" class="alert alert-info" style="margin-top:15px;">
                    &#128204; Ready — Enter Roll Number to begin.
                </div>

            </form>
        </div>
    </div>
</div>

<script>
/* ════════════════════════════════════════════════
   CONFIG
   ════════════════════════════════════════════════ */
var TOKEN    = "90935188|-31949239798991463|90958760";
var DB_NAME  = "SCHOOL-DB";
var REL_NAME = "STUDENT-TABLE";
var BASE_URL = "https://api.login2explore.com:5577";
var IML      = "/api/iml";
var IRL      = "/api/irl";

/* ════════════════════════════════════════════════
   CORE — XMLHttpRequest (works on GitHub Pages HTTPS)
   ════════════════════════════════════════════════ */
function executeCommand(reqObj, endpoint) {
    var result = null;
    try {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", BASE_URL + endpoint, false);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.send(JSON.stringify(reqObj));
        if (xhr.responseText) {
            result = JSON.parse(xhr.responseText);
        }
    } catch(e) {
        result = { status: 0, message: e.message };
    }
    return result;
}

/* ════════════════════════════════════════════════
   BUILD REQUESTS
   ════════════════════════════════════════════════ */
function buildGET(rollNo) {
    return {
        token  : TOKEN,
        cmd    : "GET_BY_KEY",
        dbName : DB_NAME,
        rel    : REL_NAME,
        jsonStr: { rollNo: rollNo }
    };
}

function buildPUT(dataObj) {
    return {
        token  : TOKEN,
        cmd    : "PUT",
        dbName : DB_NAME,
        rel    : REL_NAME,
        jsonStr: dataObj
    };
}

function buildUPDATE(dataObj, recNo) {
    return {
        token  : TOKEN,
        cmd    : "UPDATE",
        dbName : DB_NAME,
        rel    : REL_NAME,
        recNo  : recNo,
        jsonStr: dataObj
    };
}

/* ════════════════════════════════════════════════
   FORM HELPERS
   ════════════════════════════════════════════════ */
function getFormObj() {
    return {
        rollNo         : $("#rollNo").val().trim(),
        fullName       : $("#fullName").val().trim(),
        "class"        : $("#studentClass").val().trim(),
        birthDate      : $("#birthDate").val(),
        address        : $("#address").val().trim(),
        enrollmentDate : $("#enrollmentDate").val()
    };
}

function fillForm(rec) {
    $("#fullName").val(rec.fullName             || "");
    $("#studentClass").val(rec["class"]         || "");
    $("#birthDate").val(rec.birthDate           || "");
    $("#address").val(rec.address               || "");
    $("#enrollmentDate").val(rec.enrollmentDate || "");
}

function clearFields() {
    $("#fullName, #studentClass, #birthDate, #address, #enrollmentDate").val("");
}

function setFieldsDisabled(flag) {
    $("#fullName, #studentClass, #birthDate, #address, #enrollmentDate").prop("disabled", flag);
}

/* ════════════════════════════════════════════════
   VALIDATION
   ════════════════════════════════════════════════ */
function validate() {
    var fields = [
        { id:"rollNo",         label:"Roll Number" },
        { id:"fullName",       label:"Full Name" },
        { id:"studentClass",   label:"Class" },
        { id:"birthDate",      label:"Birth Date" },
        { id:"address",        label:"Address" },
        { id:"enrollmentDate", label:"Enrollment Date" }
    ];
    for (var i = 0; i < fields.length; i++) {
        if ($("#" + fields[i].id).val().trim() === "") {
            showMsg("&#10060; " + fields[i].label + " is required!", "danger");
            $("#" + fields[i].id).focus();
            return false;
        }
    }
    return true;
}

/* ════════════════════════════════════════════════
   UI HELPERS
   ════════════════════════════════════════════════ */
function showMsg(text, type) {
    $("#messageDiv")
        .removeClass("alert-info alert-success alert-danger alert-warning")
        .addClass("alert-" + (type || "info"))
        .html(text)
        .show();
}

var currentRecNo = null;

/* ════════════════════════════════════════════════
   RESET
   ════════════════════════════════════════════════ */
function resetToInitial() {
    $("#rollNo").val("").prop("disabled", false);
    clearFields();
    setFieldsDisabled(true);
    $("#saveBtn, #updateBtn, #resetBtn").prop("disabled", true);
    currentRecNo = null;
    showMsg("&#128204; Form reset. Enter Roll Number to begin.", "info");
    $("#rollNo").focus();
}

/* ════════════════════════════════════════════════
   ON ROLL NO BLUR — auto check if record exists
   ════════════════════════════════════════════════ */
function onRollNoBlur() {
    var roll = $("#rollNo").val().trim();
    if (roll === "") { resetToInitial(); return; }

    showMsg("&#128269; Checking Roll No: <b>" + roll + "</b> ...", "info");

    var result = executeCommand(buildGET(roll), IRL);
    console.log("SEARCH:", result);

    if (result && result.status === 200) {
        // Record EXISTS → Update mode
        try {
            var d   = (typeof result.data === "string") ? JSON.parse(result.data) : result.data;
            var rec = d.record || d;
            currentRecNo = d.rec_no || null;
            fillForm(rec);
        } catch(e) { console.error(e); }

        setFieldsDisabled(false);
        $("#rollNo").prop("disabled", true);
        $("#saveBtn").prop("disabled", true);
        $("#updateBtn").prop("disabled", false);
        $("#resetBtn").prop("disabled", false);
        showMsg("&#128216; Record found — modify fields and click <b>Update</b>.", "info");
        $("#fullName").focus();

    } else {
        // Record NOT EXISTS → Save mode
        currentRecNo = null;
        clearFields();
        setFieldsDisabled(false);
        $("#saveBtn").prop("disabled", false);
        $("#updateBtn").prop("disabled", true);
        $("#resetBtn").prop("disabled", false);
        showMsg("&#127381; New Roll Number — fill all details and click <b>Save</b>.", "info");
        $("#fullName").focus();
    }
}

/* ════════════════════════════════════════════════
   SAVE
   ════════════════════════════════════════════════ */
function saveStudent() {
    if (!validate()) return;
    showMsg("&#9203; Saving...", "info");

    var result = executeCommand(buildPUT(getFormObj()), IML);
    console.log("SAVE:", result);

    if (result && result.status === 200) {
        showMsg("&#10004; Student saved successfully!", "success");
        setTimeout(resetToInitial, 1500);
    } else {
        showMsg("&#10008; Save failed: " + ((result && result.message) || JSON.stringify(result)), "danger");
    }
}

/* ════════════════════════════════════════════════
   UPDATE
   ════════════════════════════════════════════════ */
function updateStudent() {
    if (!validate()) return;
    if (!currentRecNo) { showMsg("&#9888; No record loaded. Search first.", "warning"); return; }
    showMsg("&#9203; Updating...", "info");

    var result = executeCommand(buildUPDATE(getFormObj(), currentRecNo), IML);
    console.log("UPDATE:", result);

    if (result && result.status === 200) {
        showMsg("&#10004; Student updated successfully!", "success");
        setTimeout(resetToInitial, 1500);
    } else {
        showMsg("&#10008; Update failed: " + ((result && result.message) || JSON.stringify(result)), "danger");
    }
}

/* ════════════════════════════════════════════════
   EVENT BINDING
   ════════════════════════════════════════════════ */
$(document).ready(function () {
    resetToInitial();

    $("#rollNo").on("blur", onRollNoBlur);
    $("#rollNo").on("keypress", function(e) {
        if (e.which === 13) $(this).blur();
    });
    $("#saveBtn").on("click",   saveStudent);
    $("#updateBtn").on("click", updateStudent);
    $("#resetBtn").on("click",  resetToInitial);
});
</script>
</body>
</html>
</html>
