<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Enrollment Form - JPDB</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <style>
        body { background: #f0f2f5; padding: 40px 0; }
        .panel {
            max-width: 750px; margin: auto;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.13);
        }
        .panel-heading {
            border-radius: 8px 8px 0 0;
            background: #2c6fad !important;
        }
        .panel-title { font-size: 22px; font-weight: bold; }
        label { font-weight: 600; color: #333; }
        .required:after { content: " *"; color: red; }
        .form-control { border-radius: 5px; font-size: 15px; }
        .btn { border-radius: 5px; font-weight: 600; margin-right: 6px; }
        #message { margin-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel panel-primary">
        <div class="panel-heading">
            <h3 class="panel-title">&#127979; Student Enrollment Form</h3>
        </div>
        <div class="panel-body">

            <form id="studentForm" autocomplete="off">

                <div class="form-group">
                    <label class="required">Roll No</label>
                    <input type="text" id="rollNo" class="form-control" placeholder="Enter Roll No (e.g. S101)">
                </div>

                <div class="form-group">
                    <label class="required">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Enter Full Name">
                </div>

                <div class="form-group">
                    <label class="required">Class</label>
                    <input type="text" id="studentClass" class="form-control" placeholder="e.g. 10th-A">
                </div>

                <div class="form-group">
                    <label class="required">Birth Date</label>
                    <input type="date" id="birthDate" class="form-control">
                </div>

                <div class="form-group">
                    <label class="required">Address</label>
                    <textarea id="address" class="form-control" rows="3" placeholder="Enter full address"></textarea>
                </div>

                <div class="form-group">
                    <label class="required">Enrollment Date</label>
                    <input type="date" id="enrollmentDate" class="form-control">
                </div>

                <div style="margin-top:18px;">
                    <button type="button" class="btn btn-success" id="saveBtn"   onclick="saveStudent()">&#128190; Save</button>
                    <button type="button" class="btn btn-warning" id="updateBtn" onclick="updateStudent()">&#9998; Update</button>
                    <button type="button" class="btn btn-info"                   onclick="searchStudent()">&#128269; Search</button>
                    <button type="button" class="btn btn-default"                onclick="resetForm()">&#8635; Reset</button>
                </div>

            </form>

            <div id="message"></div>

        </div>
    </div>
</div>

<script>

/* ══════════════════════════════════════════
   CONFIG  ← update your token here
   ══════════════════════════════════════════ */
var TOKEN    = "90935188|-31949239798991463|90958760";
var DB_NAME  = "SCHOOL-DB";
var REL_NAME = "STUDENT-TABLE";
var BASE_URL = "http://api.login2explore.com:5577";
var IML      = "/api/iml";
var IRL      = "/api/irl";

var currentRecNo = null;

/* ══════════════════════════════════════════
   CORE EXECUTE  (sends raw string via POST)
   ══════════════════════════════════════════ */
function executeCommand(reqString, endpoint) {
    var result;
    $.ajax({
        url     : BASE_URL + endpoint,
        type    : "POST",
        data    : reqString,
        async   : false,
        success : function(res) {
            result = (typeof res === "string") ? JSON.parse(res) : res;
        },
        error   : function(xhr) {
            try   { result = JSON.parse(xhr.responseText); }
            catch (e) { result = { status: xhr.status, message: xhr.statusText }; }
        }
    });
    return result;
}

/* ══════════════════════════════════════════
   BUILD REQUEST STRINGS
   NOTE: jsonStr value must be a JSON *object*
         (NOT a string) — this was the bug!
   ══════════════════════════════════════════ */

// PUT — insert new record
function buildPUT(dataObj) {
    var req = {
        token  : TOKEN,
        cmd    : "PUT",
        dbName : DB_NAME,
        rel    : REL_NAME,
        jsonStr: dataObj          // ← plain object, NOT JSON.stringify(dataObj)
    };
    return JSON.stringify(req);
}

// GET_BY_KEY — search by primary key
function buildGET(keyObj) {
    var req = {
        token  : TOKEN,
        cmd    : "GET_BY_KEY",
        dbName : DB_NAME,
        rel    : REL_NAME,
        jsonStr: keyObj           // ← plain object
    };
    return JSON.stringify(req);
}

// UPDATE — update existing record by rec_no
function buildUPDATE(dataObj, recNo) {
    var req = {
        token  : TOKEN,
        cmd    : "UPDATE",
        dbName : DB_NAME,
        rel    : REL_NAME,
        recNo  : recNo,
        jsonStr: dataObj          // ← plain object
    };
    return JSON.stringify(req);
}

/* ══════════════════════════════════════════
   GET FORM VALUES AS A PLAIN OBJECT
   ══════════════════════════════════════════ */
function getFormObj() {
    return {
        rollNo         : $("#rollNo").val().trim(),
        fullName       : $("#fullName").val().trim(),
        "class"        : $("#studentClass").val().trim(),
        birthDate      : $("#birthDate").val(),
        address        : $("#address").val().trim(),
        enrollmentDate : $("#enrollmentDate").val()
    };
}

/* ══════════════════════════════════════════
   FILL FORM FROM A RECORD OBJECT
   ══════════════════════════════════════════ */
function fillForm(rec) {
    $("#fullName").val(rec.fullName             || "");
    $("#studentClass").val(rec["class"]         || "");
    $("#birthDate").val(rec.birthDate           || "");
    $("#address").val(rec.address               || "");
    $("#enrollmentDate").val(rec.enrollmentDate || "");
}

/* ══════════════════════════════════════════
   VALIDATION
   ══════════════════════════════════════════ */
function validate() {
    var fields = [
        { id:"rollNo",         label:"Roll No" },
        { id:"fullName",       label:"Full Name" },
        { id:"studentClass",   label:"Class" },
        { id:"birthDate",      label:"Birth Date" },
        { id:"address",        label:"Address" },
        { id:"enrollmentDate", label:"Enrollment Date" }
    ];
    for (var i = 0; i < fields.length; i++) {
        if ($("#" + fields[i].id).val().trim() === "") {
            alert(fields[i].label + " is required!");
            $("#" + fields[i].id).focus();
            return false;
        }
    }
    return true;
}

/* ══════════════════════════════════════════
   UI STATE
   ══════════════════════════════════════════ */
function showMsg(msg, type) {
    $("#message").html(
        '<div class="alert alert-' + (type||"success") + '" style="margin-top:15px">' + msg + '</div>'
    );
}

function setButtons(state) {
    if (state === "found") {
        $("#saveBtn").prop("disabled", true);
        $("#updateBtn").prop("disabled", false);
        $("#rollNo").prop("disabled", true);
    } else {
        $("#saveBtn").prop("disabled", false);
        $("#updateBtn").prop("disabled", true);
        $("#rollNo").prop("disabled", false);
    }
}

/* ══════════════════════════════════════════
   SAVE
   ══════════════════════════════════════════ */
function saveStudent() {
    if (!validate()) return;

    var result = executeCommand(buildPUT(getFormObj()), IML);
    console.log("SAVE:", result);

    if (result && result.status === 200) {
        try {
            var d = (typeof result.data === "string") ? JSON.parse(result.data) : result.data;
            currentRecNo = Array.isArray(d.rec_no) ? d.rec_no[0] : d.rec_no;
        } catch(e) { currentRecNo = null; }

        showMsg("&#10004; Student saved! Rec No: " + currentRecNo, "success");
        setButtons("found");
    } else {
        showMsg("&#10008; Save failed: " + ((result && result.message) || JSON.stringify(result)), "danger");
    }
}

/* ══════════════════════════════════════════
   SEARCH
   ══════════════════════════════════════════ */
function searchStudent() {
    var roll = $("#rollNo").val().trim();
    if (!roll) { alert("Enter Roll No to search!"); $("#rollNo").focus(); return; }

    var result = executeCommand(buildGET({ rollNo: roll }), IRL);
    console.log("SEARCH:", result);

    if (!result || result.status !== 200) {
        showMsg("&#10008; No record found for Roll No: <b>" + roll + "</b>", "danger");
        currentRecNo = null;
        setButtons("empty");
        return;
    }

    try {
        var d   = (typeof result.data === "string") ? JSON.parse(result.data) : result.data;
        var rec = d.record || d;
        currentRecNo = d.rec_no || null;

        fillForm(rec);
        setButtons("found");
        showMsg("&#10004; Record found! You can now update.", "success");
    } catch(e) {
        showMsg("&#10008; Parse error: " + e.message, "danger");
    }
}

/* ══════════════════════════════════════════
   UPDATE
   ══════════════════════════════════════════ */
function updateStudent() {
    if (!validate()) return;
    if (!currentRecNo) { alert("Search first, then update."); return; }

    var result = executeCommand(buildUPDATE(getFormObj(), currentRecNo), IML);
    console.log("UPDATE:", result);

    if (result && result.status === 200) {
        showMsg("&#10004; Student updated successfully!", "success");
    } else {
        showMsg("&#10008; Update failed: " + ((result && result.message) || JSON.stringify(result)), "danger");
    }
}

/* ══════════════════════════════════════════
   RESET
   ══════════════════════════════════════════ */
function resetForm() {
    $("#studentForm")[0].reset();
    $("#message").html("");
    currentRecNo = null;
    setButtons("empty");
}

$(document).ready(function() { setButtons("empty"); });

</script>
</body>
</html>
